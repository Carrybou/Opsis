<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Déclarer un incident - Opsis</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/entete :: entete('stations')}"></div>

<main class="contenu">
    <nav class="fil-ariane" aria-label="Fil d'Ariane">
        <a th:href="@{/stations}">Stations</a>
        <a th:href="@{/equipements/{id}(id=${incidentRequest.idEquipement})}" th:text="${equipement.referenceUnique}">REF</a>
        <span>Déclarer un incident</span>
    </nav>

    <div class="titre-page">
        <div>
            <div class="surtitre" th:text="|Équipement - ${equipement.referenceUnique}|">Équipement - REF</div>
            <h1>Déclarer un incident</h1>
        </div>
        <div class="titre-actions">
            <div th:replace="~{fragments/badges :: etatEquipement(${equipement.etatFonctionnement})}"></div>
        </div>
    </div>

    <section class="carte">
        <div class="carte-entete"><h2>Équipement concerné</h2></div>
        <div class="carte-corps">
            <dl class="details">
                <dt>Libellé</dt>
                <dd th:text="${equipement.libelleDescription}">Libellé</dd>
                <dt>Type</dt>
                <dd th:text="${equipement.type}">TYPE</dd>
                <dt>Station</dt>
                <dd th:text="${equipement.nomStation}">Station</dd>
            </dl>
        </div>
    </section>

    <section class="carte">
        <div class="carte-entete"><h2>Incident</h2></div>
        <div class="carte-corps">
            <form class="formulaire edition-incident" th:action="@{/incidents}" th:object="${incidentRequest}" method="post" novalidate>

                <div class="message erreur" th:if="${#fields.hasErrors('*')}">
                    Le formulaire contient des erreurs, merci de les corriger.
                </div>

                <input type="hidden" th:field="*{idEquipement}">

                <label for="description">Description de l'incident</label>
                <textarea id="description" th:field="*{description}" rows="6"
                          th:classappend="${#fields.hasErrors('description')} ? 'champ-invalide'"
                          placeholder="Décrivez le problème constaté : ce qui ne fonctionne pas, depuis quand, à quel endroit précis..."></textarea>
                <p class="erreur-champ" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></p>

                <div class="actions">
                    <a th:href="@{/equipements/{id}(id=${incidentRequest.idEquipement})}" class="bouton secondaire">Annuler</a>
                    <button type="submit" class="bouton">Déclarer l'incident</button>
                </div>
            </form>
        </div>
    </section>
</main>
</body>
</html>
