<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Connexion - Opsis</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="page-connexion">
<main class="carte-connexion">
    <div class="surtitre">Opsis / supervision</div>
    <h1>Connexion</h1>

    <p class="message erreur" th:if="${erreur}" th:text="${erreur}"></p>
    <p class="message info" th:if="${param.deconnecte}">Vous avez été déconnecté.</p>

    <form th:action="@{/login}" method="post">
        <label for="identifiantConnexion">Identifiant</label>
        <input type="text" id="identifiantConnexion" name="identifiantConnexion"
               th:value="${identifiantConnexion}" required autofocus>

        <label for="motDePasse">Mot de passe</label>
        <input type="password" id="motDePasse" name="motDePasse" required>

        <button type="submit">Se connecter</button>
    </form>
</main>
</body>
</html>
