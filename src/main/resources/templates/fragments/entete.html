<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="entete(pageActive)" class="entete">
    <div class="entete-gauche">
        <a th:href="@{/accueil}" class="logo">Opsis</a>
        <nav class="navigation" th:if="${utilisateurConnecte != null}" aria-label="Navigation principale">
            <a th:if="${utilisateurConnecte.peutConsulterTableauDeBord()}" th:href="@{/tableau-de-bord}"
               th:classappend="${pageActive == 'tableau-de-bord'} ? 'actif'">Tableau de bord</a>
            <a th:href="@{/stations}" th:classappend="${pageActive == 'stations'} ? 'actif'">Stations</a>
            <a th:href="@{/carte}" th:classappend="${pageActive == 'carte'} ? 'actif'">Carte</a>
        </nav>
    </div>

    <!-- Menu du profil : pages secondaires et déconnexion. <details> fonctionne sans JS ; le script le referme au clic extérieur et sur Échap. -->
    <details class="menu-profil" th:if="${utilisateurConnecte != null}"
             th:classappend="${pageActive == 'historique' or pageActive == 'prestataires' or pageActive == 'comptes'} ? 'actif'">
        <summary th:attr="aria-label=|Menu de ${utilisateurConnecte.prenom}|">
            <span class="avatar" aria-hidden="true" th:text="${#strings.toUpperCase(#strings.substring(utilisateurConnecte.prenom, 0, 1))}">T</span>
            <span class="identite">
                <strong th:text="${utilisateurConnecte.prenom}">Prénom</strong>
                <span th:text="${utilisateurConnecte.libelleProfil()}">Profil</span>
            </span>
            <span class="chevron" aria-hidden="true">▾</span>
        </summary>
        <div class="menu-profil-panneau">
            <a th:href="@{/incidents/historique}" th:classappend="${pageActive == 'historique'} ? 'actif'">Historique des incidents</a>
            <a th:href="@{/prestataires}" th:classappend="${pageActive == 'prestataires'} ? 'actif'">Prestataires</a>
            <a th:if="${utilisateurConnecte.peutGererComptes()}" th:href="@{/comptes}"
               th:classappend="${pageActive == 'comptes'} ? 'actif'">Gestion des comptes</a>
            <hr>
            <a th:href="@{/deconnexion}" class="deconnexion">Se déconnecter</a>
        </div>
        <script>
            (function () {
                const menu = document.currentScript.closest('details');
                document.addEventListener('click', function (e) {
                    if (menu.open && !menu.contains(e.target)) {
                        menu.open = false;
                    }
                });
                document.addEventListener('keydown', function (e) {
                    if (e.key === 'Escape' && menu.open) {
                        menu.open = false;
                        menu.querySelector('summary').focus();
                    }
                });
            })();
        </script>
    </details>
</header>
</body>
</html>
