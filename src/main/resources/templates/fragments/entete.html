<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="entete(pageActive)" class="entete">
    <div class="entete-gauche">
        <a th:href="@{/stations}" class="logo">Opsis</a>
        <nav class="navigation" th:if="${utilisateurConnecte != null}">
            <a th:href="@{/stations}" th:classappend="${pageActive == 'stations'} ? 'actif'">Stations</a>
        </nav>
    </div>
    <div class="utilisateur" th:if="${utilisateurConnecte != null}">
        Bonjour <strong th:text="${utilisateurConnecte.prenom}">Prénom</strong>
        (<span th:text="${utilisateurConnecte.profil}">PROFIL</span>)
        | <a th:href="@{/deconnexion}">Déconnectez-vous</a>
    </div>
</header>
</body>
</html>
