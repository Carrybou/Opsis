<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="|${titre} - Opsis|">Erreur - Opsis</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/entete :: entete}"></div>

<main class="contenu page-erreur">
    <h1 th:text="${titre}">Une erreur est survenue</h1>
    <p th:text="${message}">Message</p>
    <div class="actions-erreur">
        <a href="javascript:history.back()" class="bouton secondaire">Retour</a>
        <a th:href="@{/stations}" class="bouton">Voir les stations</a>
    </div>
</main>
</body>
</html>
