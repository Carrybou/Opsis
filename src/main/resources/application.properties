spring.application.name=Opsis

# 7.7 -- Aucun secret dans le dépôt : ils viennent de variables d'environnement. En local, Spring les lit dans le fichier .env (non versionné),
# créé à partir de .env.example : plus besoin de les charger à la main, que l'on lance depuis un terminal ou depuis l'IDE.
spring.config.import=optional:file:.env[.properties]

# Port du MySQL lancé par docker-compose (3307) ; surchargeable avec la variable d'environnement DB_PORT (ex. DB_PORT=3306 pour un MySQL local).
spring.datasource.url=jdbc:mysql://localhost:${DB_PORT:3307}/Base_ALTN72?serverTimezone=Europe/Paris
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Un formulaire HTML ne sait envoyer que GET et POST, or les pages de modification utilisent aussi PUT et DELETE.
# Cette propriété active le HiddenHttpMethodFilter de Spring MVC : il lit le champ caché "_method" du formulaire (valeur PUT ou DELETE)
# et fait comme si la requête POST avait cette méthode.
spring.mvc.hiddenmethod.filter.enabled=true

jwt.secret=${JWT_SECRET}
jwt.expiration=7d

server.servlet.session.timeout=30m

# RG8 -- Par défaut, Jackson tronque un nombre décimal reçu pour un champ entier (une note de 4.5 deviendrait 4) : on préfère une erreur 400.
spring.jackson.deserialization.accept-float-as-int=false

# F12 -- Swagger ne documente que l'API, pas les pages. Les réponses d'erreur sont décrites route par route : sans ce réglage,
# springdoc ajouterait à chaque route tous les cas des advices, y compris ceux qui ne la concernent pas.
springdoc.paths-to-match=/api/**
springdoc.override-with-generic-response=false
