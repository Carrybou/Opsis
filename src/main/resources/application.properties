spring.application.name=Opsis

# 7.7 -- Aucun secret dans le dépôt : ils viennent de variables d'environnement. En local, Spring les lit dans le fichier .env (non versionné),
# créé à partir de .env.example : plus besoin de les charger à la main, que l'on lance depuis un terminal ou depuis l'IDE.
spring.config.import=optional:file:.env[.properties]

# Port du MySQL lancé par docker-compose (3307) ; surchargeable avec la variable d'environnement DB_PORT (ex. DB_PORT=3306 pour un MySQL local).
spring.datasource.url=jdbc:mysql://localhost:${DB_PORT:3307}/Base_ALTN72?serverTimezone=Europe/Paris
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# 5.10.2 / 5.10.3 (note technique 3) -- Un formulaire HTML ne sait envoyer que GET et POST, or notre API utilise aussi PUT et DELETE.
# Cette propriété active le HiddenHttpMethodFilter de Spring MVC : il lit le champ caché "_method" du formulaire (valeur PUT ou DELETE)
# et fait comme si la requête POST avait cette méthode. Désactivé par défaut : sans cette ligne, "Supprimez" et "Modifiez" donnent une erreur 405.
spring.mvc.hiddenmethod.filter.enabled=true

# 5.10.2 / 5.12 -- Quand l'id n'existe pas, le contrôleur lève une ResponseStatusException (404) avec un message.
# Par défaut Spring Boot masque ce message dans la page d'erreur : cette propriété l'affiche, ce qui aide à comprendre l'erreur pendant le TP.
spring.web.error.include-message=always

jwt.secret=${JWT_SECRET}
jwt.expiration=7d

server.servlet.session.timeout=30m

# RG8 -- Par défaut, Jackson tronque un nombre décimal reçu pour un champ entier (une note de 4.5 deviendrait 4) : on préfère une erreur 400.
spring.jackson.deserialization.accept-float-as-int=false
