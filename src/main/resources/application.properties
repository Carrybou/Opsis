spring.application.name=Opsis

spring.datasource.url=jdbc:mysql://localhost:3307/Base_ALTN72
spring.datasource.username=root
spring.datasource.password=${MYSQL_ROOT_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 5.10.2 / 5.10.3 (note technique 3) -- Un formulaire HTML ne sait envoyer que GET et POST, or notre API utilise aussi PUT et DELETE.
# Cette propriété active le HiddenHttpMethodFilter de Spring MVC : il lit le champ caché "_method" du formulaire (valeur PUT ou DELETE)
# et fait comme si la requête POST avait cette méthode. Désactivé par défaut : sans cette ligne, "Supprimez" et "Modifiez" donnent une erreur 405.
spring.mvc.hiddenmethod.filter.enabled=true

# 5.10.2 / 5.12 -- Quand l'id n'existe pas, le contrôleur lève une ResponseStatusException (404) avec un message.
# Par défaut Spring Boot masque ce message dans la page d'erreur : cette propriété l'affiche, ce qui aide à comprendre l'erreur pendant le TP.
server.error.include-message=always
