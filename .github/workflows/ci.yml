# À chaque push et pull request : compile, lance tous les tests (dont ceux sur vraie base MySQL, Docker est disponible
# sur ces machines) et publie le rapport de couverture JaCoCo. Aucun secret nécessaire : les tests ont leur propre clé.
name: CI

on:
  push:
  pull_request:

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Tests et couverture
        run: sh ./mvnw -B verify
      - name: Rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: couverture-jacoco
          path: target/site/jacoco/
          if-no-files-found: ignore
